version: "3"

vars:
  APP_NAME: ev-charger-app
  DIST_DIR: dist

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  # ── Development ──────────────────────────────────

  dev:
    desc: Start development server with HMR
    cmds:
      - npx vite

  preview:
    desc: Preview production build locally
    deps: [build]
    cmds:
      - npx vite preview

  # ── Build ────────────────────────────────────────

  build:
    desc: Production build
    cmds:
      - npx vite build
    sources:
      - src/**/*
      - index.html
      - vite.config.js
    generates:
      - "{{.DIST_DIR}}/**/*"

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.DIST_DIR}} node_modules/.vite

  # ── Quality ──────────────────────────────────────

  lint:
    desc: Run ESLint
    cmds:
      - npx eslint src/

  lint:fix:
    desc: Run ESLint with auto-fix
    cmds:
      - npx eslint src/ --fix

  # ── Testing ──────────────────────────────────────

  test:
    desc: Run Playwright tests
    cmds:
      - npx playwright test

  test:ui:
    desc: Run Playwright tests with UI
    cmds:
      - npx playwright test --ui

  test:headed:
    desc: Run Playwright tests in headed mode
    cmds:
      - npx playwright test --headed

  # ── Setup ────────────────────────────────────────

  install:
    desc: Install dependencies
    cmds:
      - npm install

  setup:
    desc: Full project setup (install + playwright browsers)
    cmds:
      - npm install
      - npx playwright install --with-deps

  # ── CI / Deploy ──────────────────────────────────

  ci:
    desc: Run full CI pipeline (lint + build + test)
    cmds:
      - task: lint
      - task: build
      - task: test

  check:
    desc: Quick quality check (lint + build)
    cmds:
      - task: lint
      - task: build
