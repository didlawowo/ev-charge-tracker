name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pull requests opened from a fork are not executed on the self-hosted runners:
# a fork could run arbitrary code on them. Maintainers run the checks on an
# internal branch before merging (see CONTRIBUTING.md).
jobs:
  lint:
    runs-on: arc-runner-ev-charge-tracker
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          # Ephemeral runner: no persistent npm cache.
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: arc-runner-ev-charge-tracker
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build

  test-e2e:
    runs-on: arc-runner-ev-charge-tracker
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      # Build again here instead of transferring the dist artifact between
      # ephemeral runners.
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test
      - uses: actions/upload-artifact@v7
        if: failure()
        # Uploading the report must not hide the real test result.
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  version-bump:
    runs-on: arc-runner-ev-charge-tracker
    needs: [lint, build, test-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: version-bump-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Rebase onto latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Bump patch version
        run: 'npm version patch -m "chore(release): bump version to %s [skip ci]"'
      - name: Push changes
        run: git push origin HEAD:main --follow-tags

  release:
    runs-on: arc-runner-ev-charge-tracker
    needs: version-bump
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Resolve release tag
        run: echo "TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)" >> "$GITHUB_ENV"
      - name: Package static build
        run: tar -czf "dist-$TAG.tar.gz" -C dist .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
          else
            gh release create "$TAG" "dist-$TAG.tar.gz" --title "$TAG" --generate-notes
          fi
