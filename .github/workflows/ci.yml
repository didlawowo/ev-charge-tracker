name: CI

# Runners : scale set ARC `arc-runner-ev-charge-tracker` dans le cluster (continuous-delivery,
# ApplicationSet arc-runners). Les runners GitHub hébergés ne démarrent plus aucun
# job depuis le 2026-09-10 (facturation du compte).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: arc-runner-ev-charge-tracker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          # Runner ARC éphémère : pas de cache npm côté GitHub, comme les autres
          # dépôts du cluster (dc-home, solar-monitoring).
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: arc-runner-ev-charge-tracker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build

  test-e2e:
    runs-on: arc-runner-ev-charge-tracker
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      # Build refait ici plutôt que de transférer l'artefact dist entre runners éphémères
      - run: npm run build
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test
      - uses: actions/upload-artifact@v7
        if: failure()
        # L'envoi d'artefact ne doit pas masquer le vrai résultat des tests
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  version-bump:
    runs-on: arc-runner-ev-charge-tracker
    needs: [lint, build, test-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: version-bump-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Rebase onto latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Bump patch version
        run: 'npm version patch -m "chore(release): bump version to %s [skip ci]"'
      - name: Push changes
        run: git push origin HEAD:main --follow-tags
